    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/image/cropped-Frame-88.png"

</head>
<body data-theme="bright">
     <!-- navbar -->
    <nav class="navbar navbar-expand-lg bg-primary-subtle py-4">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
          <img
            src="assets/image/cropped-Frame-88.png"
            alt="Logo"
            width="30"
            class="d-inline-block align-text-top rounded"
          />
          <span class="fw-bold text-primary-emphasis">IDN E-Report</span>
        </a>
        <button
          class="navbar-toggler shadow-none"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav ms-auto gap-3 pt-3 pt-lg-0">
            <li class="nav-item">
              <a
                class="nav-link text-primary-emphasis active"
                aria-current="page"
                href="index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-primary-emphasis" href="index.html#about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-primary-emphasis" href="index.html#services">Services</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link text-primary-emphasis dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Other
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="Recent.html">Recent</a></li>
                <li><a class="dropdown-item" href="FAQ.html">FAQ</a></li>
              </ul>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link text-primary-emphasis dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Theme
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item theme-option" data-theme="bright">
                    Bright
                  </a>
                </li>

                <li>
                  <a class="dropdown-item theme-option" data-theme="dark">
                    Dark
                  </a>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>

    <!-- JavaScript Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const themeOptions = document.querySelectorAll(".theme-option");
        const heroImage = document.getElementById("heroImage");

        const savedTheme = localStorage.getItem("portfolio_theme") || "bright";

        // Terapkan theme + gambar saat pertama kali halaman dibuka
        setTheme(savedTheme, false);

        themeOptions.forEach((option) => {
          option.addEventListener("click", (event) => {
            event.preventDefault();

            const selectedTheme = option.dataset.theme;

            setTheme(selectedTheme, true);

            localStorage.setItem("portfolio_theme", selectedTheme);
          });
        });

        function setTheme(theme, animate = true) {
          // Pastikan theme valid
          if (theme !== "bright" && theme !== "dark") {
            theme = "bright";
          }

          const imageSrc =
            theme === "dark"
              ? "assets/image/hero-dark.png"
              : "assets/image/hero-bright.svg";

          // FIRST LOAD
          if (!animate) {
            document.body.setAttribute("data-theme", theme);

            if (heroImage) {
              heroImage.src = imageSrc;
            }

            return;
          }

          // THEME CHANGE ANIMATION
          if (heroImage) {
            heroImage.classList.add("theme-changing");
          }

          setTimeout(() => {
            document.body.setAttribute("data-theme", theme);

            if (heroImage) {
              heroImage.src = imageSrc;
            }

            requestAnimationFrame(() => {
              if (heroImage) {
                heroImage.classList.remove("theme-changing");
              }
            });
          }, 250);
        }
      });
    </script>
</body>
</html>
