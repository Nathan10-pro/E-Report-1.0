    <!-- recent -->
    <section id="recent" class="py-5">
      <div class="container">
        <div
          class="d-flex flex-column flex-lg-row mb-5 justify-content-center justify-content-lg-between align-items-center"
        >
          <div class="col-lg-8 text-center text-lg-start">
            <h1
              data-aos="fade-up"
              data-aos-duration="2000"
              data-aos-delay="100"
              class="fw-bold text-primary-emphasis mb-4"
            >
              Report Your Complaints
            </h1>
            <p
              data-aos="fade-up"
              data-aos-duration="2000"
              data-aos-delay="250"
              class="text-secondary-emphasis lh-lg fs-6"
            >
              Here are some of the most recent complaints submitted by our
              users.
            </p>
          </div>
          <div class="col-lg-2 mt-4 align-items-center">
            <button
              type="button"
              data-bs-toggle="modal"
              data-bs-target="#exampleModal"
              data-aos="fade-up"
              data-aos-duration="2000"
              data-aos-delay="100"
              class="btn btn-primary width-100 fw-bold text-primary-emphasis mb-4"
            >
              <i class="fa-solid fa-plus"></i>Add Complaints

        <a

            />

    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h1 class="modal-title fs-5 semi-bold" id="exampleModalLabel">
              <i class="fa-solid fa-pen-to-square"></i>Add Your Complaint
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form action="">
            <div class="modal-body p-4" style="padding: 3rem;">
              <div class="mb-4">
                <label class="form-label fw-semibold">Title</label>
                <input
                  class="form-control shadow-sm"
                  type="text"
                  placeholder="Insert the title"
                />
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold" for="">Category</label>
                <select class="form-select" aria-label="Default select example">
                  <option selected>selected</option>
                  <option value="academic">Academic</option>
                  <option value="facility">Facility</option>
                </select>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Your report</label>
                <textarea class="form-control" rows="6" placeholder="Report"></textarea>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Upload images</label>
                <input class="form-control" type="file" accept="image/*">
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="reset"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Reset
              </button>
              <button type="submit" class="btn btn-primary">
               <i class="fa-solid fa-paper-plane me-2"></i>Upload
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- footer -->
    <footer class="bg-primary-subtle py-4">
      <div class="container text-center">
        <p class="mb-0 text-secondary-emphasis">
          &copy; 2026 IDN E-Report. All rights reserved.
        </p>

    </footer>

    <!-- JavaScript Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const themeOptions = document.querySelectorAll(".theme-option");
        const heroImage = document.getElementById("heroImage");

        const savedTheme = localStorage.getItem("portfolio_theme") || "bright";

        // Terapkan theme + gambar saat pertama kali halaman dibuka
        setTheme(savedTheme, false);

        themeOptions.forEach((option) => {
          option.addEventListener("click", (event) => {
            event.preventDefault();

            const selectedTheme = option.dataset.theme;

            setTheme(selectedTheme, true);

            localStorage.setItem("portfolio_theme", selectedTheme);
          });
        });

        function setTheme(theme, animate = true) {
          // Pastikan theme valid
          if (theme !== "bright" && theme !== "dark") {
            theme = "bright";
          }

          const imageSrc =
            theme === "dark"
              ? "assets/image/hero-dark.png"
              : "assets/image/hero-bright.svg";

          // FIRST LOAD
          if (!animate) {
            document.body.setAttribute("data-theme", theme);

            if (heroImage) {
              heroImage.src = imageSrc;
            }

            return;
          }

          // THEME CHANGE ANIMATION
          if (heroImage) {
            heroImage.classList.add("theme-changing");
          }

          setTimeout(() => {
            document.body.setAttribute("data-theme", theme);

            if (heroImage) {
              heroImage.src = imageSrc;
            }

            requestAnimationFrame(() => {
              if (heroImage) {
                heroImage.classList.remove("theme-changing");
              }
            });
          }, 250);
        }
      });
    </script>
    <script src="../assets/logic.js"></script>
  </body>
</html>
