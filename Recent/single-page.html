    <script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const themeOptions = document.querySelectorAll(".theme-option");
        const heroImage = document.getElementById("heroImage");

        const savedTheme = localStorage.getItem("portfolio_theme") || "bright";

        // Terapkan theme + gambar saat pertama kali halaman dibuka
        setTheme(savedTheme, false);

        themeOptions.forEach((option) => {
          option.addEventListener("click", (event) => {
            event.preventDefault();

            const selectedTheme = option.dataset.theme;

            setTheme(selectedTheme, true);

            localStorage.setItem("portfolio_theme", selectedTheme);
          });
        });

        function setTheme(theme, animate = true) {
          // Pastikan theme valid
          if (theme !== "bright" && theme !== "dark") {
            theme = "bright";
          }

          const imageSrc =
            theme === "dark"
              ? "assets/image/hero-dark.png"
              : "assets/image/hero-bright.svg";

          // FIRST LOAD
          if (!animate) {
            document.body.setAttribute("data-theme", theme);

            if (heroImage) {
              heroImage.src = imageSrc;
            }

            return;
          }

          // THEME CHANGE ANIMATION
          if (heroImage) {
            heroImage.classList.add("theme-changing");
          }

          setTimeout(() => {
            document.body.setAttribute("data-theme", theme);

            if (heroImage) {
              heroImage.src = imageSrc;
            }

            requestAnimationFrame(() => {
              if (heroImage) {
                heroImage.classList.remove("theme-changing");
              }
            });
          }, 250);
        }
      });
    </script>
